name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: backend · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.14
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Без Postgres и Redis: интеграционные тесты идут на SQLite, окружение — в tests/conftest.py.
      - run: uv run pytest -q

  frontend:
    name: frontend · typecheck + lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build

  smoke:
    name: smoke · docker compose + сценарии из behaviour.md
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env.dev
      - run: docker compose -f docker-compose.dev.yml up -d --build --wait backend backend-worker
      - run: docker compose -f docker-compose.dev.yml exec -T backend alembic upgrade head
      - run: bash scripts/smoke.sh
      - name: логи при падении
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color --tail=200
      - if: always()
        run: docker compose -f docker-compose.dev.yml down -v
