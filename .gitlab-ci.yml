# Тот же набор проверок, что в .github/workflows/ci.yml, для GitLab.
# Smoke-прогон через docker compose здесь не продублирован: ему нужен docker-in-docker
# или shell-runner с Docker, а это зависит от конкретной инсталляции GitLab.

stages:
  - check

backend:
  stage: check
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  variables:
    UV_CACHE_DIR: .uv-cache
    UV_LINK_MODE: copy
  cache:
    key: backend-uv
    paths:
      - backend/.uv-cache
  before_script:
    - cd backend
    - uv sync --locked
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest -q

frontend:
  stage: check
  image: node:22-alpine
  cache:
    key: frontend-npm
    paths:
      - frontend/.npm
  before_script:
    - cd frontend
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run check
    - npm run build
